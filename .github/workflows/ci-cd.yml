name: CI/CD - Portal de notas (Cloud Run)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  construir-y-probar:
    name: Construir y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Cobertura
        run: npm run test:cov

      - name: Construir el paquete de despliegue
        run: |
          mkdir -p paquete
          cp -r src public package.json package-lock.json Dockerfile paquete/
          cd paquete
          npm ci --omit=dev --no-audit --no-fund
          zip -rq ../deploy.zip .
          cd ..
          ls -lh deploy.zip

      - name: Publicar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: paquete-app
          path: deploy.zip
          retention-days: 5

  desplegar:
    name: Desplegar en Cloud Run
    runs-on: ubuntu-latest
    needs: construir-y-probar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar el artefacto
        uses: actions/download-artifact@v4
        with:
          name: paquete-app

      - name: Desempaquetar el artefacto
        run: |
          mkdir -p paquete
          unzip -q deploy.zip -d paquete
          ls paquete

      - name: Autenticarse contra GCP sin secretos
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Preparar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Construir y subir la imagen
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          IMAGEN="${{ vars.AR_REPO }}/portal-notas:${{ github.sha }}"
          docker build -t "$IMAGEN" paquete/
          docker push "$IMAGEN"
          echo "IMAGEN=$IMAGEN" >> $GITHUB_ENV

      - name: Desplegar la revision
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image="$IMAGEN" \
            --region="${{ vars.GCP_REGION }}" \
            --platform=managed \
            --quiet

      - name: Prueba de humo contra el sitio publicado
        run: |
          URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
                 --region="${{ vars.GCP_REGION }}" --format='value(status.url)')
          echo "Verificando $URL/health"
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$URL/health"; then
              echo ""
              echo "Sitio arriba en el intento $i"
              exit 0
            fi
            echo "Intento $i sin respuesta; esperando 15 s"
            sleep 15
          done
          echo "El sitio no respondio despues de 6 intentos"
          exit 1
